<!DOCTYPE html>
<!-- IRC Chat - Embedded Kiwi IRC -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanWorld Chat</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
        }
        
        .header {
            background-color: #2d2d2d;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #4CAF50;
        }
        
        .header h1 {
            margin: 0;
            color: #4CAF50;
        }
        
        .header p {
            margin-top: 10px;
            color: #aaa;
        }
        
        .chat-container {
            width: 100%;
            height: calc(100vh - 100px);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .info-box {
            background-color: #2d2d2d;
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        .info-box h3 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        
        .info-box ul {
            margin-left: 20px;
            color: #ccc;
        }
        
        .info-box li {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🌐 LanWorld Chat</h1>
        <p>Welcome to the #lanworld IRC channel on Libera.Chat</p>
    </div>
    
    <div class="chat-container">
        <!-- Kiwi IRC Embed -->
        <iframe 
            src="https://kiwiirc.com/nextclient/#irc://irc.libera.chat/#lanworld?nick=Guest_?"
            style="border:0; width:100%; height:100%;">
        </iframe>
    </div>
    
    <!-- Optional: Instructions (you can remove this section if you want) -->
    <!--
    <div class="info-box">
        <h3>💬 How to Use:</h3>
        <ul>
            <li>Enter your nickname when prompted</li>
            <li>You'll automatically join the #lanworld channel</li>
            <li>Type messages in the box at the bottom</li>
            <li>Press Enter to send</li>
            <li>Chat is real-time with everyone in the channel</li>
        </ul>
    </div>
    -->
</body>
</html>
